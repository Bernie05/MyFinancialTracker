<!doctype html>
<html>
<head><meta charset="utf-8"><title>TransactionRow — preview</title><style>body{margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.stack{display:flex;flex-direction:column;gap:16px;max-width:420px}</style></head>
<body>
<div id="root"></div>
<script>
  var M = window.MFT, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(M.Card, { title: 'Recent transactions', subtitle: 'October 2026', padding: 'none', action: h(M.Button, { variant: 'ghost', size: 'sm' }, 'See all'), style: { maxWidth: '560px' } },
    h(M.TransactionRow, { description: 'Puregold Cubao', category: 'Groceries', categoryColor: 1, date: 'Oct 12', minorUnits: -284575 }),
    h(M.TransactionRow, { description: 'October salary', category: 'Salary', categoryColor: 2, date: 'Oct 10', minorUnits: 5200000, meta: 'BPI Savings' }),
    h(M.TransactionRow, { description: 'Grab ride to Makati', category: 'Transport', categoryColor: 3, date: 'Oct 9', minorUnits: -32000 })));
</script>
</body>
</html>
