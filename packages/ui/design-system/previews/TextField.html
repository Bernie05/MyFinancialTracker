<!doctype html>
<html>
<head><meta charset="utf-8"><title>TextField — preview</title><style>body{margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.stack{display:flex;flex-direction:column;gap:16px;max-width:420px}</style></head>
<body>
<div id="root"></div>
<script>
  var M = window.MFT, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'stack' },
    h(M.TextField, { label: 'Amount', prefix: '₱', inputMode: 'decimal', placeholder: '0.00', defaultValue: '1,250.00', hint: 'What you paid, including fees' }),
    h(M.TextField, { label: 'Monthly budget', prefix: '₱', suffix: '/ month', inputMode: 'decimal', defaultValue: '0', error: 'Enter an amount above ₱0' })));
</script>
</body>
</html>
