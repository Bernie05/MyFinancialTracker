<!doctype html>
<html>
<head><meta charset="utf-8"><title>Badge — preview</title><style>body{margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.stack{display:flex;flex-direction:column;gap:16px;max-width:420px}</style></head>
<body>
<div id="root"></div>
<script>
  var M = window.MFT, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'row' },
    h(M.Badge, { category: 1 }, 'Groceries'),
    h(M.Badge, { category: 3 }, 'Transport'),
    h(M.Badge, { category: 4 }, 'Dining out'),
    h(M.Badge, { tone: 'income' }, 'Salary'),
    h(M.Badge, { tone: 'expense' }, 'Overdue'),
    h(M.Badge, { tone: 'goal' }, 'Emergency fund')));
</script>
</body>
</html>
