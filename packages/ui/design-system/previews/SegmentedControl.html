<!-- @dsCard group="Inputs" height=80 subtitle="Transaction type and report period" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>SegmentedControl — preview</title><style>body{margin:0;padding:20px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.stack{display:flex;flex-direction:column;gap:16px;max-width:420px}</style></head>
<body>
<div id="root"></div>
<script>
  var M = window.MFT, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(function Demo() {
    var a = React.useState('expense'), b = React.useState('month');
    return h('div', { className: 'row' },
      h(M.SegmentedControl, { 'aria-label': 'Transaction type', value: a[0], onChange: a[1], options: [{ value: 'expense', label: 'Expense' }, { value: 'income', label: 'Income' }] }),
      h(M.SegmentedControl, { 'aria-label': 'Report period', size: 'sm', value: b[0], onChange: b[1], options: [{ value: 'week', label: 'Week' }, { value: 'month', label: 'Month' }, { value: 'year', label: 'Year' }] }));
  }));
</script>
</body>
</html>
