<!doctype html>
<html>
<head><meta charset="utf-8"><title>MyFinancialTracker — cover</title>
<style>
  html, body { margin: 0; }
  body { width: 960px; height: 288px; position: relative; overflow: hidden; background: var(--surface); font-family: var(--font-sans); }
  svg { position: absolute; left: 0; top: 0; }
  .bar { rx: var(--radius-sm); }
  .pine { fill: var(--pine); }
  .income { fill: var(--income); }
  .marigold { fill: var(--marigold); }
  .expense { fill: var(--expense); }
  .text { position: absolute; left: 24px; top: 144px; max-width: 900px; }
  h1 { margin: 0; color: var(--ink); font-size: 64px; line-height: 0.95; font-weight: 650; letter-spacing: -0.02em; }
  p { margin: 12px 0 0; color: var(--ink-muted); font-size: 14px; line-height: 20px; }
</style></head>
<body>
  <svg width="960" height="112" viewBox="0 0 960 112" aria-hidden="true">
    <!--
      blocks: 20 bars, width space-6 (32px) on a 48px pitch (gap space-4), heights 24–112; fills pine ×15, income ×3, expense ×1, marigold ×1 (the tallest, last).
      arrangement: top-band skeleton (name has no space and is wider than 440px at 64px); bars stand on the band's bottom edge and are cut flat by it, rising left to right and running off the right edge.
      pattern: the literal motif, a rising bar skyline, taken from the logo mark's ascending bars; it says "your money, measured over time", which is this brand's whole job.
      scales: width space-6, gap space-4, side inset space-5, corners radius-sm.
    -->
    <rect class="bar pine" x="24" y="88" width="32" height="36"/>
    <rect class="bar pine" x="72" y="76" width="32" height="48"/>
    <rect class="bar pine" x="120" y="82" width="32" height="42"/>
    <rect class="bar pine" x="168" y="66" width="32" height="58"/>
    <rect class="bar pine" x="216" y="72" width="32" height="52"/>
    <rect class="bar income" x="264" y="58" width="32" height="66"/>
    <rect class="bar pine" x="312" y="68" width="32" height="56"/>

    <rect class="bar expense" x="408" y="60" width="32" height="64"/>
    <rect class="bar pine" x="456" y="42" width="32" height="82"/>
    <rect class="bar pine" x="504" y="52" width="32" height="72"/>
    <rect class="bar income" x="552" y="34" width="32" height="90"/>
    <rect class="bar pine" x="600" y="44" width="32" height="80"/>
    <rect class="bar pine" x="648" y="26" width="32" height="98"/>
    <rect class="bar pine" x="696" y="36" width="32" height="88"/>
    <rect class="bar pine" x="744" y="18" width="32" height="106"/>
    <rect class="bar income" x="792" y="28" width="32" height="96"/>
    <rect class="bar pine" x="840" y="10" width="32" height="114"/>
    <rect class="bar pine" x="888" y="20" width="32" height="104"/>
    <rect class="bar marigold" x="936" y="0" width="32" height="124"/>
  </svg>
  <div class="text">
    <h1>MyFinancialTracker</h1>
    <p>Calm, exact, numbers first: a well-kept passbook for your money.</p>
  </div>
</body>
</html>
